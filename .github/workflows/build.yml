name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Release build (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcode-select -p
          cc --version

      - name: Build
        run: make all

      - name: Verify binary
        run: |
          lipo -archs bin/sketchybar
          lipo -archs bin/sketchybar | grep -qw arm64
          ./bin/sketchybar --version

      # The release ships the default font (FuraCode Nerd Font) next to the
      # binary: sketchybar runs without it, but asks the user to install it.
      - name: Package
        run: |
          test -f fonts/Fura.zip || { echo "::error::fonts/Fura.zip is missing"; exit 1; }
          VERSION="$(./bin/sketchybar --version)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p "dist/$VERSION/fonts"
          cp bin/sketchybar "dist/$VERSION/"
          cp fonts/Fura.zip "dist/$VERSION/fonts/"
          tar -czf "dist/$VERSION-macos-arm64.tar.gz" -C dist "$VERSION"
          rm -rf "dist/$VERSION"
          (cd dist && shasum -a 256 *.tar.gz | tee SHA256SUMS)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VERSION }}-macos-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
