name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck --version
          files="$(git ls-files 'plugins/*.sh' 'tests/*.sh' sketchybarrc)"
          echo "$files"
          # shellcheck disable=SC2086
          shellcheck --severity=error --shell=sh $files

      - name: Python syntax
        run: |
          files="$(git ls-files 'plugins/*.py')"
          if [ -z "$files" ]; then echo "no python plugins"; exit 0; fi
          echo "$files"
          # shellcheck disable=SC2086
          python3 -m py_compile $files

  smoke:
    name: Smoke tests (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Passing CFLAGS on the command line replaces the makefile's flags
        # entirely (including the target-specific -target), so spell them out.
        include:
          - name: strict
            cflags: -std=c99 -Wall -Werror -O3 -ffast-math -fvisibility=hidden -fno-common -target arm64-apple-macos11
          - name: asan+ubsan
            cflags: -std=c99 -Wall -Werror -g -fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer -target arm64-apple-macos11
    steps:
      - uses: actions/checkout@v4

      - name: Build (${{ matrix.name }})
        run: make arm64 CFLAGS="${{ matrix.cflags }}"

      - name: Run smoke tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./tests/smoke.sh bin/sketchybar
